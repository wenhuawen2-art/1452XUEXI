name: Push daily Notion lesson
on:
  schedule:
    - cron: '7,37 23 * * *'
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notion-daily
  cancel-in-progress: false
jobs:
  push:
    if: vars.ENABLE_NOTION_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check parent and push one lesson
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          SITE_URL: https://wenhuawen2-art.github.io/1452XUEXI/
        run: node scripts/push-notion.mjs
