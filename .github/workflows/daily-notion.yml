name: Push daily Notion lesson
on:
  schedule:
    - cron: '0,30 23 * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check validates access; sample creates/reuses a trial lesson'
        type: choice
        options: [check, sample, push]
        default: check
permissions:
  contents: read
concurrency:
  group: notion-daily
  cancel-in-progress: false
jobs:
  push:
    if: vars.ENABLE_NOTION_PUSH == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check parent and push one lesson
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_ID: ${{ secrets.NOTION_PARENT_ID }}
          SITE_URL: https://wenhuawen2-art.github.io/1452XUEXI/
          NOTION_MODE: ${{ inputs.mode }}
          COURSE_START_DATE: ${{ vars.COURSE_START_DATE }}
        run: |
          if [ "$NOTION_MODE" = "check" ]; then
            node scripts/push-notion.mjs --check
          elif [ "$NOTION_MODE" = "sample" ]; then
            node scripts/push-notion.mjs --sample
          else
            node scripts/push-notion.mjs
          fi
