name: Keep scheduled learning active
on:
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record public workflow heartbeat
        run: |
          mkdir -p .runtime
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .runtime/last-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .runtime/last-heartbeat.txt
          git commit -m 'chore: scheduled workflow heartbeat' || true
          git push
